[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "open-embodied-jepa"
version = "0.1.0"
description = "Mac-first research framework for interchangeable robot world models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["numpy>=2.2,<3", "pyyaml>=6,<7"]

[project.optional-dependencies]
learning = ["torch>=2.7,<3"]
sim = ["mujoco>=3.3,<4", "pillow>=11,<13"]
lewm = [
    "torch>=2.7,<3",
    "einops>=0.8,<1",
    "transformers>=4.50,<5",
]
jepa-wms = ["torch>=2.7,<3", "einops>=0.8,<1", "timm==1.0.19"]
data = [
    "datasets>=4,<5",
    "pandas>=2.2,<4",
    "pillow>=11,<13",
    "pyarrow>=21,<24",
]
compatibility = [
    "accelerate>=1.10,<2",
    "av>=15,<16",
    "deepdiff>=7,<9",
    "draccus==0.10.0",
    "jsonlines>=4,<5",
    "torchvision>=0.22,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/embodied_jepa"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
