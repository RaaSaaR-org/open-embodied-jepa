# Arm C (readout ablation): arm A with TASK-050-style UNIFORM readout loss and no auxiliary
# position targets. Isolates what the motion weighting and the auxiliary targets
# contribute; everything else is identical to apple_wm_v3_lewm.yaml.
extends: apple_wm_v3_lewm.yaml
world_model:
  checkpoints:
    leworldmodel: ../checkpoints/task052-wm-v3/leworldmodel_v2_readout.pt
  settings:
    leworldmodel:
      readout_moving_weight: 0.0
      readout_auxiliary_weight: 0.0
